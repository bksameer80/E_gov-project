<!DOCTYPE html>
<html>
<head>
    <title>Municipal E-Governance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="mb-2 text-primary">Municipal Certificate Application</h3>
            <p class="text-muted small mb-4">Official civic certificate issuance system. <a href="/track/">Already applied? Track status here</a></p>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Enter applicant full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mobile Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="e.g. 98XXXXXXXX" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Certificate Type</label>
                    <select name="certificate_type" class="form-select" required>
                        <option value="BIRTH">Birth Registration Certificate</option>
                        <option value="RESIDENCY">Local Residency Recommendation</option>
                        <option value="RELATION">Relationship Verification Certificate</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Upload ID Proof / Citizenship / Recommendation Document</label>
                    <input type="file" name="supporting_doc" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Submit Application</button>
            </form>
        </div>
    </div>
</body>
</html>
