<!DOCTYPE html>
<html>
<head>
    <title>Application Submitted</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5 text-center">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow-sm p-4">
            <div class="text-success mb-3" style="font-size: 3rem;">✓</div>
            <h3>Application Received</h3>
            <p class="text-muted">Your application has been routed to the municipal verification desk.</p>
            <div class="alert alert-info my-3">
                <span class="small text-uppercase d-block">Your Tracking ID</span>
                <strong class="fs-4">{{ tracking_id }}</strong>
            </div>
            <p class="small text-muted">Keep this tracking ID to check your approval status.</p>
            <div class="d-grid gap-2">
                <a href="/track/?tracking_id={{ tracking_id }}" class="btn btn-primary">Track Application</a>
                <a href="/" class="btn btn-outline-secondary">Submit Another Application</a>
            </div>
        </div>
    </div>
</body>
</html>
